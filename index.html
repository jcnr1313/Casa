<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSync - Control de Casa</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Iconos Grandes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .transition-all-custom { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-24">

    <!-- HEADER -->
    <header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-6 shadow-lg rounded-b-3xl">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">🏠 Nuestra Casa</h1>
                <p class="text-xs text-indigo-200 mt-0.5">Control inteligente en tiempo real</p>
            </div>
            <div class="bg-white/20 p-2.5 rounded-full backdrop-blur-sm">
                <i class="fa-solid fa-wifi text-emerald-400 animate-pulse text-lg" title="Sincronizado en tiempo real"></i>
            </div>
        </div>
    </header>

    <!-- NAVEGACIÓN DE SECCIONES -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- SECCIÓN 1: LISTA DE LA COMPRA -->
        <section class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 transition-all-custom hover:shadow-md">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-amber-100 text-amber-600 p-3 rounded-2xl text-xl">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg">Supermercado</h2>
                        <p class="text-xs text-slate-400">Añade lo que falte en casa</p>
                    </div>
                </div>
                <span id="counter-compra" class="bg-amber-50 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-full">0</span>
            </div>

            <!-- Input para añadir -->
            <div class="flex gap-2 mb-4">
                <input type="text" id="input-item" placeholder="Ej. Leche, Huevos..." 
                    class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
                <button onclick="addItemCompra()" class="bg-amber-500 hover:bg-amber-600 text-white px-5 rounded-2xl font-bold shadow-lg shadow-amber-500/30 transition-all active:scale-95">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>

            <!-- Lista de elementos -->
            <ul id="lista-compra" class="space-y-2.5">
                <!-- Se inyecta por JS -->
            </ul>
        </section>

        <!-- SECCIÓN 2: BOTIQUÍN / MEDICAMENTOS -->
        <section class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 transition-all-custom hover:shadow-md">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-rose-100 text-rose-600 p-3 rounded-2xl text-xl">
                        <i class="fa-solid fa-pills"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-lg">Botiquín en Casa</h2>
                        <p class="text-xs text-slate-400">Control de caducidades</p>
                    </div>
                </div>
            </div>

            <!-- Listado de Medicamentos Mock -->
            <div class="space-y-3">
                <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm">Ibuprofeno 600mg</span>
                            <span class="bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded-full font-semibold">Adultos</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">Para dolor de cabeza y fiebre</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg">Caduca: 10/2027</span>
                    </div>
                </div>

                <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100">
                    <div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-sm">Apiretal Gotas</span>
                            <span class="bg-purple-100 text-purple-700 text-[10px] px-2 py-0.5 rounded-full font-semibold">Niños</span>
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">Paracetamol infantil</p>
                    </div>
                    <div class="text-right">
                        <span class="text-xs font-bold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-lg">Caduca: 05/2026</span>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- SCRIPT DE INTERACTIVIDAD -->
    <script>
        // Datos de ejemplo iniciales para la compra
        let itemsCompra = [
            { id: 1, texto: 'Papel higiénico', comprado: false },
            { id: 2, texto: 'Café de grano', comprado: true }
        ];

        function renderCompra() {
            const lista = document.getElementById('lista-compra');
            const contador = document.getElementById('counter-compra');
            lista.innerHTML = '';
            
            contador.innerText = itemsCompra.filter(i => !i.comprado).length;

            itemsCompra.forEach(item => {
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-3.5 rounded-2xl border transition-all-custom ${item.comprado ? 'bg-slate-50 border-slate-100 opacity-60' : 'bg-white border-slate-200 shadow-sm'}`;
                
                li.innerHTML = `
                    <div class="flex items-center space-x-3 cursor-pointer flex-1" onclick="toggleComprado(${item.id})">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${item.comprado ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'}">
                            ${item.comprado ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </div>
                        <span class="text-sm font-medium ${item.comprado ? 'line-through text-slate-400' : 'text-slate-700'}">${item.texto}</span>
                    </div>
                    <button onclick="eliminarItem(${item.id})" class="text-slate-300 hover:text-rose-500 p-2 transition-colors">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;
                lista.appendChild(li);
            });
        }

        function addItemCompra() {
            const input = document.getElementById('input-item');
            if(input.value.trim() === '') return;

            itemsCompra.push({
                id: Date.now(),
                texto: input.value.trim(),
                comprado: false
            });

            input.value = '';
            renderCompra();
        }

        function toggleComprado(id) {
            itemsCompra = itemsCompra.map(i => i.id === id ? {...i, comprado: !i.comprado} : i);
            renderCompra();
        }

        function eliminarItem(id) {
            itemsCompra = itemsCompra.filter(i => i.id !== id);
            renderCompra();
        }

        // Carga inicial
        renderCompra();
    </script>
</body>
</html>
