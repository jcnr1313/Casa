<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSync Pro - Control de Casa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .transition-all-custom { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-32">

    <!-- HEADER FIJO SUPERIOR -->
    <header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-6 shadow-lg rounded-b-3xl sticky top-0 z-20">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">🏠 Nuestra Casa</h1>
                <p id="header-subtitle" class="text-xs text-indigo-200 mt-0.5">Control inteligente en tiempo real</p>
            </div>
            <div class="bg-white/20 p-2.5 rounded-full backdrop-blur-sm flex items-center gap-2">
                <i class="fa-solid fa-wifi text-emerald-400 animate-pulse text-lg" title="Sincronizado"></i>
            </div>
        </div>
    </header>

    <!-- CONTENEDOR DE PESTAÑAS -->
    <main class="max-w-md mx-auto p-4">

        <!-- VISTA 1: RESUMEN / CASA -->
        <section id="tab-home" class="tab-content active space-y-4">
            <!-- Estado General / Clima -->
            <div class="bg-gradient-to-br from-indigo-500 to-indigo-700 text-white p-5 rounded-3xl shadow-sm relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 text-white/10 text-8xl">
                    <i class="fa-solid fa-house-signal"></i>
                </div>
                <div class="relative z-10">
                    <span class="bg-white/20 text-xs px-3 py-1 rounded-full font-semibold backdrop-blur-sm">Valencia</span>
                    <div class="mt-4 flex items-baseline justify-between">
                        <div>
                            <h2 class="text-3xl font-bold">24°C</h2>
                            <p class="text-xs text-indigo-100 mt-0.5">Parcialmente nublado • Casa Segura</p>
                        </div>
                        <div class="text-right">
                            <i class="fa-solid fa-shield-halved text-2xl text-emerald-300"></i>
                            <p class="text-[10px] text-emerald-200 font-bold mt-1">Alarma Armada</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Accesos rápidos / Domótica básica -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-700 mb-3 text-sm flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-amber-500"></i> Automatizaciones Rápidas
                </h3>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="triggerAction('Modo Noche activado')" class="p-3.5 bg-slate-50 hover:bg-indigo-50 border border-slate-100 hover:border-indigo-200 rounded-2xl text-left transition-all group">
                        <i class="fa-solid fa-moon text-indigo-500 text-lg mb-2 group-hover:scale-110 transition-transform"></i>
                        <div class="font-bold text-xs">Modo Noche</div>
                        <div class="text-[10px] text-slate-400">Luces y persianas</div>
                    </button>
                    <button onclick="triggerAction('Modo Ausente activado')" class="p-3.5 bg-slate-50 hover:bg-indigo-50 border border-slate-100 hover:border-indigo-200 rounded-2xl text-left transition-all group">
                        <i class="fa-solid fa-person-walking-arrow-right text-indigo-500 text-lg mb-2 group-hover:scale-110 transition-transform"></i>
                        <div class="font-bold text-xs">Modo Ausente</div>
                        <div class="text-[10px] text-slate-400">Ahorro y seguridad</div>
                    </button>
                </div>
            </div>
        </section>

        <!-- VISTA 2: LISTA DE LA COMPRA -->
        <section id="tab-compra" class="tab-content space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-3">
                        <div class="bg-amber-100 text-amber-600 p-3 rounded-2xl text-xl">
                            <i class="fa-solid fa-cart-shopping"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-lg">Supermercado</h2>
                            <p class="text-xs text-slate-400">Añade lo que falte en casa</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="counter-compra" class="bg-amber-50 text-amber-700 text-xs font-bold px-2.5 py-1 rounded-full">0</span>
                        <button onclick="limpiarComprados()" title="Eliminar completados" class="text-slate-400 hover:text-rose-500 text-xs p-1.5 transition-colors">
                            <i class="fa-solid fa-broom"></i>
                        </button>
                    </div>
                </div>

                <!-- Input para añadir -->
                <div class="flex gap-2 mb-4">
                    <input type="text" id="input-item" placeholder="Ej. Leche, Huevos..." 
                        onkeypress="handleKeyPress(event)"
                        class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all">
                    <button onclick="addItemCompra()" class="bg-amber-500 hover:bg-amber-600 text-white px-5 rounded-2xl font-bold shadow-lg shadow-amber-500/35 transition-all active:scale-95">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <ul id="lista-compra" class="space-y-2.5"></ul>
            </div>
        </section>

        <!-- VISTA 3: BOTIQUÍN -->
        <section id="tab-botiquin" class="tab-content space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-3">
                        <div class="bg-rose-100 text-rose-600 p-3 rounded-2xl text-xl">
                            <i class="fa-solid fa-pills"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-lg">Botiquín en Casa</h2>
                            <p class="text-xs text-slate-400">Control de caducidades</p>
                        </div>
                    </div>
                </div>
                <div id="lista-botiquin" class="space-y-3"></div>
            </div>
        </section>

        <!-- VISTA 4: NOTAS / AVISOS -->
        <section id="tab-notas" class="tab-content space-y-4">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-3">
                        <div class="bg-indigo-100 text-indigo-600 p-3 rounded-2xl text-xl">
                            <i class="fa-solid fa-note-sticky"></i>
                        </div>
                        <div>
                            <h2 class="font-bold text-lg">Avisos y Notas</h2>
                            <p class="text-xs text-slate-400">Recados rápidos para casa</p>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 mb-4">
                    <input type="text" id="input-nota" placeholder="Ej. El paquete llega mañana..." 
                        onkeypress="handleNotaKeyPress(event)"
                        class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                    <button onclick="addNota()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 rounded-2xl font-bold shadow-lg shadow-indigo-500/35 transition-all active:scale-95">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <ul id="lista-notas" class="space-y-2.5"></ul>
            </div>
        </section>

    </main>

    <!-- BARRA DE NAVEGACIÓN INFERIOR (BOTTOM NAV) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 p-3 z-30 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="switchTab('home', this)" class="nav-btn flex flex-col items-center text-indigo-600 transition-all">
                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span class="text-[10px] font-bold">Casa</span>
            </button>
            <button onclick="switchTab('compra', this)" class="nav-btn flex flex-col items-center text-slate-400 hover:text-slate-600 transition-all">
                <i class="fa-solid fa-cart-shopping text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Compra</span>
            </button>
            <button onclick="switchTab('botiquin', this)" class="nav-btn flex flex-col items-center text-slate-400 hover:text-slate-600 transition-all">
                <i class="fa-solid fa-pills text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Botiquín</span>
            </button>
            <button onclick="switchTab('notas', this)" class="nav-btn flex flex-col items-center text-slate-400 hover:text-slate-600 transition-all">
                <i class="fa-solid fa-note-sticky text-lg mb-1"></i>
                <span class="text-[10px] font-medium">Notas</span>
            </button>
        </div>
    </nav>

    <!-- SCRIPTS DE CONTROL -->
    <script>
        // --- CONTROL DE PESTAÑAS ---
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-indigo-600');
                btn.classList.add('text-slate-400');
                const span = btn.querySelector('span');
                span.classList.remove('font-bold');
                span.classList.add('font-medium');
            });

            btnElement.classList.remove('text-slate-400');
            btnElement.classList.add('text-indigo-600');
            const span = btnElement.querySelector('span');
            span.classList.remove('font-medium');
            span.classList.add('font-bold');

            // Subtítulo dinámico superior
            const sub = document.getElementById('header-subtitle');
            if(tabId === 'home') sub.innerText = "Control inteligente en tiempo real";
            if(tabId === 'compra') sub.innerText = "Gestión de la lista de la compra";
            if(tabId === 'botiquin') sub.innerText = "Control de stock y caducidades";
            if(tabId === 'notas') sub.innerText = "Tablón de avisos familiares";
        }

        // --- COMPRA ---
        let itemsCompra = JSON.parse(localStorage.getItem('homesync_compra')) || [
            { id: 1, texto: 'Papel higiénico', comprado: false },
            { id: 2, texto: 'Café de grano', comprado: true }
        ];

        function renderCompra() {
            const lista = document.getElementById('lista-compra');
            const contador = document.getElementById('counter-compra');
            lista.innerHTML = '';
            contador.innerText = itemsCompra.filter(i => !i.comprado).length;

            const itemsOrdenados = [...itemsCompra].sort((a, b) => a.comprado - b.comprado);

            itemsOrdenados.forEach(item => {
                const li = document.createElement('li');
                li.className = `flex items-center justify-between p-3.5 rounded-2xl border transition-all-custom ${item.comprado ? 'bg-slate-50 border-slate-100 opacity-60' : 'bg-white border-slate-200 shadow-sm'}`;
                li.innerHTML = `
                    <div class="flex items-center space-x-3 cursor-pointer flex-1" onclick="toggleComprado(${item.id})">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition-all ${item.comprado ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300'}">
                            ${item.comprado ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </div>
                        <span class="text-sm font-medium ${item.comprado ? 'line-through text-slate-400' : 'text-slate-700'}">${item.texto}</span>
                    </div>
                    <button onclick="eliminarItem(${item.id})" class="text-slate-300 hover:text-rose-500 p-2 transition-colors">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;
                lista.appendChild(li);
            });
            localStorage.setItem('homesync_compra', JSON.stringify(itemsCompra));
        }

        function addItemCompra() {
            const input = document.getElementById('input-item');
            if(input.value.trim() === '') return;
            itemsCompra.unshift({ id: Date.now(), texto: input.value.trim(), comprado: false });
            input.value = '';
            renderCompra();
        }

        function handleKeyPress(e) { if(e.key === 'Enter') addItemCompra(); }
        function toggleComprado(id) { itemsCompra = itemsCompra.map(i => i.id === id ? {...i, comprado: !i.comprado} : i); renderCompra(); }
        function eliminarItem(id) { itemsCompra = itemsCompra.filter(i => i.id !== id); renderCompra(); }
        function limpiarComprados() { itemsCompra = itemsCompra.filter(i => !i.comprado); renderCompra(); }

        // --- BOTIQUÍN ---
        const medicamentos = [
            { nombre: 'Ibuprofeno 600mg', tipo: 'Adultos', tipoClase: 'bg-blue-100 text-blue-700', desc: 'Para dolor de cabeza y fiebre', caducidad: '2027-10' },
            { nombre: 'Apiretal Gotas', tipo: 'Niños', tipoClase: 'bg-purple-100 text-purple-700', desc: 'Paracetamol infantil', caducidad: '2026-05' }
        ];

        function renderBotiquin() {
            const contenedor = document.getElementById('lista-botiquin');
            contenedor.innerHTML = '';
            const hoy = new Date();

            medicamentos.forEach(med => {
                const [ano, mes] = med.caducidad.split('-');
                const fechaCad = new Date(ano, mes - 1);
                let diffMeses = (fechaCad.getFullYear() - hoy.getFullYear()) * 12 + (fechaCad.getMonth() - hoy.getMonth());
                
                let badgeClase = 'bg-emerald-50 text-emerald-600';
                let textoCad = `Caduca: ${mes}/${ano}`;
                
                if (diffMeses < 0) {
                    badgeClase = 'bg-rose-50 text-rose-600';
                    textoCad = `Caducado (${mes}/${ano})`;
                } else if (diffMeses <= 3) {
                    badgeClase = 'bg-amber-50 text-amber-600';
                    textoCad = `Caduca pronto (${mes}/${ano})`;
                }

                contenedor.innerHTML += `
                    <div class="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-sm">${med.nombre}</span>
                                <span class="${med.tipoClase} text-[10px] px-2 py-0.5 rounded-full font-semibold">${med.tipo}</span>
                            </div>
                            <p class="text-xs text-slate-400 mt-0.5">${med.desc}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold ${badgeClase} px-2.5 py-1 rounded-lg">${textoCad}</span>
                        </div>
                    </div>
                `;
            });
        }

        // --- NOTAS RÁPIDAS ---
        let notas = JSON.parse(localStorage.getItem('homesync_notas')) || [
            { id: 1, texto: 'Acordarse de regar las plantas de la terraza' }
        ];

        function renderNotas() {
            const lista = document.getElementById('lista-notas');
            lista.innerHTML = '';

            notas.forEach(nota => {
                const li = document.createElement('li');
                li.className = "flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100 shadow-sm";
                li.innerHTML = `
                    <span class="text-sm text-slate-700 font-medium flex-1">${nota.texto}</span>
                    <button onclick="eliminarNota(${nota.id})" class="text-slate-300 hover:text-rose-500 p-2 transition-colors">
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                `;
                lista.appendChild(li);
            });
            localStorage.setItem('homesync_notas', JSON.stringify(notas));
        }

        function addNota() {
            const input = document.getElementById('input-nota');
            if(input.value.trim() === '') return;
            notas.unshift({ id: Date.now(), texto: input.value.trim() });
            input.value = '';
            renderNotas();
        }

        function handleNotaKeyPress(e) { if(e.key === 'Enter') addNota(); }
        function eliminarNota(id) { notas = notas.filter(n => n.id !== id); renderNotas(); }

        // --- ACCIONES RÁPIDAS ---
        function triggerAction(mensaje) {
            alert("Acción ejecutada: " + mensaje);
        }

        // Inicialización general
        renderCompra();
        renderBotiquin();
        renderNotas();
    </script>
</body>
</html>
